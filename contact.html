<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặng Gia Bảo – Liên hệ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Đặng Gia Bảo</h1>
        <p>Kết nối với tôi</p>
        <nav>
            <a href="index.html">Trang chủ</a> | 
            <a href="about.html">Giới thiệu</a> | 
            <a href="contact.html">Liên hệ</a>
        </nav>
    </header>

    <main>
    <section>
        <h2>Liên hệ với tôi</h2>
        <form action="#" method="POST">
            <fieldset>
                <legend> Thông tin cá nhân</legend>
                <div>
                    <label for="fullname">Họ tên:</label>
                    <input time="text" id="fullname" name="fullname" required minlength="2">
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="phone">Điện thoại:</label>
                     <input type="tel" id="phone" name="phone" pattern="[0-9]{10,11}">
                </div>
            </fieldset>
            <!-- FIELDSET THỨ 2 (BƯỚC 3) -->
        <fieldset>
            <legend>Nội dung liên hệ</legend>

            <div>
                <label for="topic">Chủ đề:</label>
                <select id="topic" name="topic">
                    <option value="Hỗ trợ">Hỗ trợ</option>
                    <option value="Học tập">Học tập</option>
                    <option value="Khác">Khác</option>
                </select>
            </div>

            <div>
                <label>Ưu tiên liên hệ:</label>
                <label><input type="radio" name="priority" value="email"> Email</label>
                <label><input type="radio" name="priority" value="phone"> Phone</label>
                <label><input type="radio" name="priority" value="zalo"> Zalo</label>
            </div>

            <div>
                <label for="message">Tin nhắn:</label>
                <textarea id="message" name="message" rows="5" required minlength="10"></textarea>
            </div>

            <div>
                <label>
                    <input type="checkbox" name="agree" required> Tôi đồng ý với các điều khoản
                </label>
            </div>
        </fieldset>
        <div>
            <button type="Submit">Gửi tin nhắn</button>
            <button type="Reset">Xóa và nhập lại</button>
        </div>
    </section>
</main>

    <footer>
        <address>Email: baobao14t@gmail.com | Điện thoại: 0799868046</address>

    </footer>
</body>
</html>
